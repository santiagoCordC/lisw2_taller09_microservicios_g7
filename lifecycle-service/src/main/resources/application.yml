server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: lifecycle-service
  datasource:
    url: jdbc:h2:mem:lifecycledb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        default-requeue-rejected: false   # tras agotar reintentos el mensaje va a la DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

lifecycle:
  # Retardo artificial al procesar el comando, para evidenciar en Postman que la
  # respuesta 202 llega antes de que la transición termine (estado PENDING -> COMPLETED).
  processing-delay-ms: ${LIFECYCLE_DELAY_MS:1500}

logging:
  level:
    co.edu.unicauca: INFO
