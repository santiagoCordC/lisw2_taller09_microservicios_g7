server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: question-service
  datasource:
    url: jdbc:h2:mem:questiondb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    connection-timeout: 3s
    # Confirmación del broker: el 202 solo se responde si RabbitMQ recibió el comando
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

# URLs de los microservicios invocados de forma síncrona (REST)
services:
  timeout-ms: 3000
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  validation:
    url: ${VALIDATION_SERVICE_URL:http://localhost:8082}
  lifecycle:
    url: ${LIFECYCLE_SERVICE_URL:http://localhost:8084}

operations:
  # Si una operación sigue PENDING después de este tiempo, se consulta a Lifecycle por REST
  reconcile-after-ms: 4000

logging:
  level:
    co.edu.unicauca: INFO
